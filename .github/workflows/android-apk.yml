name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Unzip source file
        run: |
          mkdir -p source_dir
          unzip -q KTX_Direct_Android.zip -d source_dir
          
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Set up Android SDK path
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > source_dir/KTX_Direct_Android/local.properties
          
      - name: Download and Setup Gradle (v8.0)
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.0-bin.zip
          unzip -q gradle-8.0-bin.zip
          echo "$PWD/gradle-8.0/bin" >> $GITHUB_PATH
          
      - name: Build with Gradle
        run: gradle assembleDebug --info
        working-directory: source_dir/KTX_Direct_Android
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: source_dir/KTX_Direct_Android/app/build/outputs/apk/debug/app-debug.apk
