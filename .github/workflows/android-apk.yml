name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Unzip source file
        run: |
          mkdir -p source_dir
          unzip -q KTX_Direct_Android.zip -d source_dir
          echo "=== 압축 해제된 폴더 구조 확인 ==="
          find source_dir -maxdepth 3
          
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Find and Build with Gradle
        run: |
          GRADLEW_PATH=$(find source_dir -name "gradlew" | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: gradlew file not found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          echo "Found project directory: $PROJECT_DIR"
          
          chmod +x "$GRADLEW_PATH"
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: source_dir/**/app/build/outputs/apk/debug/app-debug.apk
