name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Unzip source file
        run: |
          unzip KTX_Direct_Android.zip -d source_dir
          
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Grant execute permission for gradlew
        run: chmod +x source_dir/KTX_Direct_Android/gradlew
        
      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug
        working-directory: source_dir/KTX_Direct_Android
        
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: source_dir/KTX_Direct_Android/app/build/outputs/apk/debug/app-debug.apk

