name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Unzip source file
        run: |
          mkdir -p source_dir
          unzip -q KTX_Direct_Android.zip -d source_dir
          
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Set up Android SDK path
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > source_dir/KTX_Direct_Android/local.properties
          
      - name: Install Gradle and Build
        run: |
          sudo apt-get update && sudo apt-get install -y gradle
          cd source_dir/KTX_Direct_Android
          gradle assembleDebug --stacktrace
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: source_dir/KTX_Direct_Android/app/build/outputs/apk/debug/app-debug.apk
